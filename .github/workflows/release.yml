name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libpulse0
      - name: Build
        run: cargo build --release -j 1
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p stage
          cp target/release/dicegame stage/dice-wars
          cp README.md LICENSE assets/icon.png assets/FONT-LICENSE.txt stage/
          tar -czf "dice-wars-${RELEASE_TAG}-linux-x86_64.tar.gz" -C stage dice-wars README.md LICENSE FONT-LICENSE.txt icon.png
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" "dice-wars-${RELEASE_TAG}-linux-x86_64.tar.gz" --clobber

  windows:
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --release -j 1
      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/dicegame.exe stage/DiceWars.exe
          Copy-Item README.md,LICENSE,assets/FONT-LICENSE.txt,assets/icon.ico stage/
          Compress-Archive -Path stage/* -DestinationPath "dice-wars-$env:RELEASE_TAG-windows-x86_64.zip"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "dice-wars-${RELEASE_TAG}-windows-x86_64.zip" --clobber; then
              exit 0
            fi
            echo "upload attempt $i failed; retrying" >&2
            sleep 15
          done
          exit 1

  macos:
    needs: linux
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --release -j 1 --target aarch64-apple-darwin
          cargo build --release -j 1 --target x86_64-apple-darwin
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app="stage/Dice Wars.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/dice-wars" \
            target/aarch64-apple-darwin/release/dicegame \
            target/x86_64-apple-darwin/release/dicegame
          lipo -info "$app/Contents/MacOS/dice-wars"
          iconset="$RUNNER_TEMP/DiceWars.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" assets/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z "$double" "$double" assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/DiceWars.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Dice Wars</string>
            <key>CFBundleDisplayName</key><string>Dice Wars</string>
            <key>CFBundleIdentifier</key><string>io.github.lenniaconrad.dicewars</string>
            <key>CFBundleExecutable</key><string>dice-wars</string>
            <key>CFBundleIconFile</key><string>DiceWars</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.strategy-games</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature so the bundle seal covers Info.plist on Apple Silicon.
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          cp README.md LICENSE assets/FONT-LICENSE.txt stage/
          ditto -c -k --sequesterRsrc stage "dice-wars-${RELEASE_TAG}-macos-universal.zip"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "dice-wars-${RELEASE_TAG}-macos-universal.zip" --clobber; then
              exit 0
            fi
            echo "upload attempt $i failed; retrying" >&2
            sleep 15
          done
          exit 1
